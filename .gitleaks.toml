# gitleaks 配置。扩展默认规则集，只加 allowlist，不放宽任何规则。
#
# 为什么需要它：`gitleaks detect --no-git` 扫的是文件系统，会命中开发者本机的
# `.env` —— 这些文件从未入库、也在 .gitignore 中，但扫描器不看 git 状态。
# 不排除的话每个开发者本地都是常红，常红的门禁等于没有门禁。
#
# ⚠️ 这里只排除「按设计不会入库」的路径。任何入库文件都必须照默认规则扫。
# `frontend/pnpm-lock.yaml` 若误报再加，现在不加。

[extend]
useDefault = true

[allowlist]
description = "本机专用、按设计不入库的文件"
paths = [
    # 本地/生产凭据。根 .gitignore 已排除，从未作为开源口径入库
    '''^\.env$''',
    '''^backend/\.env$''',
    # 虚拟环境与依赖目录（--no-git 会走进去）
    '''(^|/)venv/''',
    '''^frontend/node_modules/''',
    # 本地数据目录（轨迹文件，可能含用户粘贴的凭据）
    '''^data/''',
]
