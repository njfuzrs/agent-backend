# Agent Backend Nginx 配置（URL 前缀 /traj/ 是冻结区，与开源仓名分叉是有意的）
# 在已有的 server 块内追加以下 location 块
# 或作为独立配置文件 /etc/nginx/conf.d/trajectory-platform.conf

# /traj 无尾斜杠 → 301 重定向到 /traj/
location = /traj {
    return 301 /traj/;
}

# 前端静态文件（SPA）
location /traj/ {
    alias /opt/trajectory-platform/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /traj/index.html;
}

# SPA fallback — 精确匹配避免 alias+try_files 循环
location = /traj/index.html {
    alias /opt/trajectory-platform/frontend/dist/index.html;
}

# 后端 API 反代。
# /ready 不在这里：它只证明数据库，方案要求只从本机 127.0.0.1:8900 探。
# 精确匹配优先于本前缀，所以下面那个 location 必须留在同一 server 块里。
location /traj/api/ {
    proxy_pass http://127.0.0.1:8900/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # $request_id 是 nginx 内置变量，32 位十六进制，应用会原样采用
    # （见 core/middleware.py 的形状校验）。应用自己也会写回这个头，
    # 不隐藏的话响应里会有两个同值的 X-Request-ID。只留 nginx 这一个，
    # 它和 access log 用的是同一个变量。
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;

    # 上传文件大小限制
    client_max_body_size 100M;

    # 超时设置（大文件上传）
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# 就绪检查不进公网。精确匹配盖住上面的 /traj/api/ 前缀，
# 公网（含 https://www.sid-code.cc/traj/api/v1/ready）拿到 404，
# 发版冒烟继续打 http://127.0.0.1:8900/api/v1/ready。
location = /traj/api/v1/ready {
    return 404;
}

# M6：WebSocket 中继。必须单独一个 location，追加到 HTTPS 的 server 块里。
# 现有 /traj/api/ 没有 Upgrade，整段加上会让所有 API 都带 Connection: upgrade，
# 对普通 POST 无益，对排障有害。不要把这一段放进 HTTP 的 server 块：
# 明文 Upgrade 等于凭证通道走了明文。
# 本文件是参考件，生产 nginx 不随发版覆盖，要人手追加再 reload。
location /traj/api/v1/bridge/ws {
    proxy_pass http://127.0.0.1:8901/api/v1/bridge/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
