# Agent Backend Nginx 配置（URL 前缀 /traj/ 是冻结区，与开源仓名分叉是有意的）
# 在已有的 server 块内追加以下 location 块
# 或作为独立配置文件 /etc/nginx/conf.d/trajectory-platform.conf

# /traj 无尾斜杠 → 301 重定向到 /traj/
location = /traj {
    return 301 /traj/;
}

# 前端静态文件（SPA）
location /traj/ {
    alias /opt/trajectory-platform/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /traj/index.html;
}

# SPA fallback — 精确匹配避免 alias+try_files 循环
location = /traj/index.html {
    alias /opt/trajectory-platform/frontend/dist/index.html;
}

# 后端 API 反代
location /traj/api/ {
    proxy_pass http://127.0.0.1:8900/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $request_id 是 nginx 内置变量。从浏览器到 nginx 到应用是同一个值，
    # 应用只在它符合形状时采用，否则自己生成（见 core/middleware.py）。
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    # 上传文件大小限制
    client_max_body_size 100M;

    # 超时设置（大文件上传）
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
