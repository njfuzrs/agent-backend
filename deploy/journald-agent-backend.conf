# 应用日志的保留期（日志方案 §3.13 / §4.6）。
#
# journald 这份配置是整机的，不是按 unit 的：至少留 14 天，不超过 30 天。
# SystemMaxRetentionSec 取上限 30 天，到点由 journald 自己删。
# SystemMaxUse 是体积兜底，防止 30 天之内就把磁盘写满；按当前体量 30 天远不到 1G。
#
# 不进 journald.conf 本体。那份文件是发行版的，发版不碰；本文件落到
# /etc/systemd/journald.conf.d/，由 deploy/ensure_journald.sh 安装。
# 装上之后重启 systemd-journald，再按 30 天 vacuum 一次：重启本身不删旧档。
[Journal]
SystemMaxRetentionSec=30day
SystemMaxUse=1G
