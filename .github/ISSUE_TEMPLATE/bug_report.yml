name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **不要在这里贴 `.traj` / raw / events / `.env` 原文。** 轨迹含完整对话，日志可能含 token。
        贴之前先删掉密钥、内网地址、会话内容。
        安全漏洞请走 [私密上报通道](https://github.com/njfuzrs/agent-backend/security/advisories/new)，不要开 issue。

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么，期望是什么
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 ...
        2. 观察 ...
    validations:
      required: true

  - type: dropdown
    id: plane
    attributes:
      label: 出问题的平面 / 模块
      options:
        - 数据面 · 上传（/api/v1/upload）
        - 数据面 · 浏览 / 搜索 / 标注
        - 管理台登录 / cookie
        - 控制面 · /ctl/（M1 前预期 501）
        - 前端
        - 部署 / 迁移 / 存储
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: commit hash，或你部署的目录 / 镜像 tag
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      description: "python3 --version（本项目要求 >= 3.10，生产是 3.10）"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（脱敏后）
      description: 请先删掉 token、口令、对象存储密钥、轨迹正文
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过已有 issue，没有重复的
          required: true
        - label: 我已从贴出的日志与配置里删除了密钥、轨迹正文等敏感信息
          required: true
        - label: 这不是安全漏洞（安全问题已走私密通道）
          required: true
